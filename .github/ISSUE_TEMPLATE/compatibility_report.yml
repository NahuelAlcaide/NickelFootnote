name: Compatibility report
description: Tell us whether NickelFootnote works on your device and firmware.
labels: [compatibility]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Kobo Libra Colour
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: 4.45.23697
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NickelFootnote version
      placeholder: 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Reading menu button
        - label: Ask Footnote in the selection menu
        - label: Series, book and chapter detected correctly
        - label: Answers arrive (Wi-Fi, sign-in, streaming)
        - label: Colours show (colour screens only)
  - type: textarea
    id: notes
    attributes:
      label: Notes and log
      description: Anything odd, plus the first ~20 lines of `.adds/nickelfootnote/log.txt`.
      render: text
